# nRF54L15 does not have USB hardware
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_HID=n
CONFIG_USB_CDC_ACM=n

# Enable UART console for serial access (alternative to RTT)
# Connect to UART20: TX=P0.0, RX=P0.1 on Arduino header
# CONFIG_UART_CONSOLE=y
# CONFIG_CONSOLE_SUBSYS=y

# Use RTT for console via J-Link debugger (default, no wiring needed)
# CONFIG_RTT_CONSOLE=y (enabled in prj.conf)
# CONFIG_USE_SEGGER_RTT=y (enabled in prj.conf)

# nRF54L15 requires larger stack sizes than nRF52840
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=2048

# Increase heap for ICM-45686 IMU driver
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Enable SPI20 peripheral explicitly
CONFIG_SPI=y
